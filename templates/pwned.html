<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pwned Password Checker | Soheil Karami</title>

    <!-- Standard Bootstrap 3 & Fonts -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <!-- Centralized Stylesheet -->
    <link href="./static/main.3f6952e4.css" rel="stylesheet">

    <!-- Tailwind utility script (for spinner/flex support) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Protect Bootstrap navbar from Tailwind resets */
        .navbar-collapse.collapse { visibility: visible !important; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

<!-- Unified Navigation Bar -->
<script src="./static/navbar.js"></script>

<div class="glow-bg"></div>

<main class="pwned-main-wrapper">
    <div class="pwned-container">

        <header class="pwned-header fade-in">
            <div class="pwned-badge">
                <svg class="pwned-badge-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                Cybersecurity Protocol
            </div>

            <h1 class="pwned-page-title">
                Pwned Password <span class="pwned-title-highlight">Checker</span>
            </h1>

            <p class="pwned-header-desc">
                Securely check if your passwords have been exposed in known data breaches. This tool utilizes the k-Anonymity model, ensuring your full password is never sent over the network.
            </p>
        </header>

        <section id="checker">
            <div class="pwned-card">
                <form id="checker-form">
                    <div class="pwned-input-group">
                        <input
                            type="password"
                            id="password-input"
                            class="pwned-input"
                            placeholder="Enter a password to check..."
                            required
                        >
                        <button
                            type="button"
                            id="toggle-visibility"
                            class="pwned-eye-btn"
                            title="Toggle Password Visibility"
                        >
                            <svg class="pwned-eye-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        </button>
                    </div>

                    <button
                        type="submit"
                        id="submit-btn"
                        class="pwned-submit-btn"
                    >
                        Check Security
                    </button>
                </form>

                <div id="result-container" class="pwned-result-container hidden">
                    <!-- Content injected via JavaScript based on API response -->
                </div>
            </div>
        </section>
    </div>
</main>

<footer class="text-center mt-auto" style="padding: 30px 0; color: #64748b; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; font-family: 'Inter', sans-serif;">
    © <script>document.write(new Date().getFullYear())</script> Soheil Karami | DevSecOps & IT Professional
</footer>

<!-- External Scripts for Navigation Toggle -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>

<script>
    // Toggle password visibility functionality
    const pwdInput = document.getElementById('password-input');
    const toggleBtn = document.getElementById('toggle-visibility');

    toggleBtn.addEventListener('click', () => {
        if (pwdInput.type === 'password') {
            pwdInput.type = 'text';
            toggleBtn.innerHTML = `<svg class="pwned-eye-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg>`;
        } else {
            pwdInput.type = 'password';
            toggleBtn.innerHTML = `<svg class="pwned-eye-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>`;
        }
    });

    // Function to generate SHA-1 Hash using Web Crypto API
    async function sha1(str) {
        const buffer = new TextEncoder().encode(str);
        const hash = await crypto.subtle.digest('SHA-1', buffer);
        const hexArray = Array.from(new Uint8Array(hash));
        return hexArray.map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
    }

    const form = document.getElementById('checker-form');
    const submitBtn = document.getElementById('submit-btn');
    const resultContainer = document.getElementById('result-container');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = pwdInput.value;
        if (!password) return;

        // Update UI to show a loading state
        submitBtn.disabled = true;
        submitBtn.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-6 w-6 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Checking Database...`;
        resultContainer.classList.add('hidden');
        resultContainer.classList.remove('pwned-result-danger', 'pwned-result-success');

        try {
            // Hash the password and split it (k-Anonymity)
            const fullHash = await sha1(password);
            const prefix = fullHash.substring(0, 5);
            const suffix = fullHash.substring(5);

            // Query the HaveIBeenPwned API
            const response = await fetch(`https://api.pwnedpasswords.com/range/${prefix}`);
            if (!response.ok) throw new Error(`API Error: ${response.status}`);
            const data = await response.text();

            // Process the results
            const hashes = data.split('\n');
            let matchCount = 0;

            for (let line of hashes) {
                const [hashSuffix, count] = line.split(':');
                if (hashSuffix.trim() === suffix) {
                    matchCount = parseInt(count, 10);
                    break;
                }
            }

            // Display results
            resultContainer.classList.remove('hidden');

            if (matchCount > 0) {
                resultContainer.classList.add('pwned-result-danger');
                resultContainer.innerHTML = `
                    <div class="flex items-start gap-4">
                        <div class="bg-red-500/20 p-3 rounded-full mt-1">
                            <svg class="w-8 h-8 text-red-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        </div>
                        <div>
                            <h3 class="pwned-result-title pwned-result-title-danger">WARNING: Password Compromised!</h3>
                            <p class="pwned-result-text">This password has been exposed in data breaches <strong class="text-white text-xl font-mono">${matchCount.toLocaleString()}</strong> times. It is highly recommended that you change this password immediately.</p>
                        </div>
                    </div>
                `;
            } else {
                resultContainer.classList.add('pwned-result-success');
                resultContainer.innerHTML = `
                    <div class="flex items-start gap-4">
                        <div class="bg-emerald-500/20 p-3 rounded-full mt-1">
                            <svg class="w-8 h-8 text-emerald-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>
                        <div>
                            <h3 class="pwned-result-title pwned-result-title-success">Secure Protocol Verified</h3>
                            <p class="pwned-result-text">This password was not found in any known data breaches. Carry on safely!</p>
                        </div>
                    </div>
                `;
            }

        } catch (error) {
            console.error(error);
            resultContainer.classList.remove('hidden');
            resultContainer.classList.add('bg-slate-800/80', 'border-slate-600');
            resultContainer.innerHTML = `
                <p class="pwned-result-text text-center">An error occurred while connecting to the verification server. Please try again later.</p>
            `;
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = `Check Security`;
        }
    });
</script>
</body>
</html>
