<body class="flex flex-col min-h-screen">

<!-- Unified Navigation Bar -->
<script src="./static/navbar.js"></script>

<div class="glow-bg"></div>

<main class="flex-grow flex flex-col justify-center" style="padding-top: 140px; padding-bottom: 80px; position: relative; z-index: 10;">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 w-full">

        <header class="text-center py-8 fade-in">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-brand-900/50 text-brand-500 text-sm font-medium mb-6 border border-brand-500/20 font-mono">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                Cybersecurity Protocol
            </div>
            <h1 class="page-title" style="margin-top: 0 !important; margin-bottom: 20px !important;">
                Pwned Password <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-500 to-cyan-300">Checker</span>
            </h1>
            <p class="mt-4 max-w-2xl text-base text-slate-400 mx-auto leading-relaxed">
                Securely check if your passwords have been exposed in known data breaches. This tool utilizes the k-Anonymity model, ensuring your full password is never sent over the network.
            </p>
        </header>

        <section id="checker" class="mb-12 fade-in" style="animation-delay: 0.1s;">
            <div class="bg-[#1e293b] rounded-2xl p-6 sm:p-8 border border-slate-700 shadow-2xl">
                <form id="checker-form" class="space-y-4">
                    <div class="relative">
                        <input
                            type="password"
                            id="password-input"
                            class="w-full bg-[#0f172a] border border-slate-600 rounded-xl px-4 py-4 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all text-lg font-mono"
                            placeholder="Enter a password to check..."
                            required
                        >
                        <button
                            type="button"
                            id="toggle-visibility"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white transition-colors p-2"
                            title="Toggle Password Visibility"
                        >
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        </button>
                    </div>
                    <button
                        type="submit"
                        id="submit-btn"
                        class="w-full bg-brand-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl transition-all duration-200 shadow-lg flex justify-center items-center gap-2 text-lg border border-brand-600"
                    >
                        Check Security
                    </button>
                </form>

                <div id="result-container" class="mt-6 hidden rounded-xl p-5 border transition-all duration-300">
                    <!-- Content injected via JavaScript based on API response -->
                </div>
            </div>
        </section>
    </div>
</main>

<footer class="text-center mt-auto" style="padding: 30px 0; color: #64748b; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; font-family: 'Inter', sans-serif;">

</footer>

<!-- External Scripts for Navigation Toggle -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>

<script>
    // Toggle password visibility functionality
    const pwdInput = document.getElementById('password-input');
    const toggleBtn = document.getElementById('toggle-visibility');

    toggleBtn.addEventListener('click', () => {
        if (pwdInput.type === 'password') {
            pwdInput.type = 'text';
            toggleBtn.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg>`;
        } else {
            pwdInput.type = 'password';
            toggleBtn.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>`;
        }
    });

    // Function to generate SHA-1 Hash using Web Crypto API
    async function sha1(str) {
        const buffer = new TextEncoder().encode(str);
        const hash = await crypto.subtle.digest('SHA-1', buffer);
        const hexArray = Array.from(new Uint8Array(hash));
        return hexArray.map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
    }

    const form = document.getElementById('checker-form');
    const submitBtn = document.getElementById('submit-btn');
    const resultContainer = document.getElementById('result-container');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = pwdInput.value;
        if (!password) return;

        // Update UI to show a loading state
        submitBtn.disabled = true;
        submitBtn.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Checking Database...`;
        resultContainer.classList.add('hidden');
        resultContainer.classList.remove('bg-red-900/20', 'border-red-500/50', 'bg-emerald-900/20', 'border-emerald-500/50');

        try {
            // Hash the password and split it (k-Anonymity)
            const fullHash = await sha1(password);
            const prefix = fullHash.substring(0, 5);
            const suffix = fullHash.substring(5);

            // Query the HaveIBeenPwned API
            const response = await fetch(`https://api.pwnedpasswords.com/range/${prefix}`);
            if (!response.ok) throw new Error(`API Error: ${response.status}`);
            const data = await response.text();

            // Process the results
            const hashes = data.split('\n');
            let matchCount = 0;

            for (let line of hashes) {
                const [hashSuffix, count] = line.split(':');
                if (hashSuffix.trim() === suffix) {
                    matchCount = parseInt(count, 10);
                    break;
                }
            }

            // Display results
            resultContainer.classList.remove('hidden');

            if (matchCount > 0) {
                resultContainer.classList.add('bg-red-900/20', 'border-red-500/50');
                resultContainer.innerHTML = `
                    <div class="flex items-start gap-4">
                        <div class="bg-red-500/20 p-2 rounded-full mt-1">
                            <svg class="w-6 h-6 text-red-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        </div>
                        <div>
                            <h3 class="text-red-400 font-bold text-xl mb-1">WARNING: Password Compromised!</h3>
                            <p class="text-slate-300 leading-relaxed text-base">This password has been exposed in data breaches <strong class="text-white text-lg font-mono">${matchCount.toLocaleString()}</strong> times. It is highly recommended that you change this password immediately.</p>
                        </div>
                    </div>
                `;
            } else {
                resultContainer.classList.add('bg-emerald-900/20', 'border-emerald-500/50');
                resultContainer.innerHTML = `
                    <div class="flex items-start gap-4">
                        <div class="bg-emerald-500/20 p-2 rounded-full mt-1">
                            <svg class="w-6 h-6 text-emerald-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>
                        <div>
                            <h3 class="text-emerald-400 font-bold text-xl mb-1">Secure Protocol Verified</h3>
                            <p class="text-slate-300 leading-relaxed text-base">This password was not found in any known data breaches. Carry on safely!</p>
                        </div>
                    </div>
                `;
            }

        } catch (error) {
            console.error(error);
            resultContainer.classList.remove('hidden');
            resultContainer.classList.add('bg-slate-800/80', 'border-slate-600');
            resultContainer.innerHTML = `
                <p class="text-slate-300 text-center">An error occurred while connecting to the verification server. Please try again later.</p>
            `;
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = `Check Security`;
        }
    });
</script>
</body>
