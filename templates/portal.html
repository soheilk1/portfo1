<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Portal | Control Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .card-bg { background-color: #0f172a; border: 1px solid #1e293b; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .visitor-scroll::-webkit-scrollbar { width: 4px; }
        .visitor-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div id="portal-container" class="w-full max-w-2xl card-bg p-8 rounded-2xl shadow-2xl">
        <!-- Header -->
        <div class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-3xl font-black text-white tracking-tight">Traffic Portal</h1>
                <p class="text-slate-500 text-sm mono mt-1">v2.0 // encrypted_session</p>
            </div>
            <button onclick="logout()" class="bg-slate-800 hover:bg-slate-700 px-5 py-2 rounded-lg text-xs font-bold transition-all border border-slate-700">LOGOUT</button>
        </div>

        <!-- Stats Grid -->
        <div class="grid grid-cols-3 gap-4 mb-8">
            <div class="bg-slate-950/50 rounded-xl p-5 border border-slate-800/50 text-center">
                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-1">Home</p>
                <div id="stat-home" class="text-3xl font-black text-blue-400">0</div>
            </div>
            <div class="bg-slate-950/50 rounded-xl p-5 border border-slate-800/50 text-center">
                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-1">Resume</p>
                <div id="stat-resume" class="text-3xl font-black text-fuchsia-400">0</div>
            </div>
            <div class="bg-slate-950/50 rounded-xl p-5 border border-slate-800/50 text-center">
                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-1">Total</p>
                <div id="stat-total" class="text-3xl font-black text-emerald-400">0</div>
            </div>
        </div>

        <!-- Visitor List -->
        <div class="bg-slate-950/50 rounded-xl p-6 border border-slate-800/50 mb-8">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Live System Logs</h3>
            <div id="visitor-list" class="visitor-scroll h-64 overflow-y-auto pr-2 space-y-3">
                <p class="text-center text-slate-600 py-10 mono text-xs italic">Initializing connection to logs...</p>
            </div>
        </div>

        <!-- Actions -->
        <div class="flex gap-3">
            <button onclick="loadStats()" class="flex-1 bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-bold transition-all shadow-lg shadow-blue-900/20">Refresh Logs</button>
            <button onclick="clearData()" class="px-6 bg-red-900/20 hover:bg-red-900/40 border border-red-900/30 text-red-400 rounded-xl font-bold transition-all">Clear</button>
        </div>
    </div>

    <script>
        const pass = sessionStorage.getItem('admin_session_pass');
        if (!pass) window.location.href = './resume.html';

        function getBadge(page) {
            const p = (page || 'unk').toLowerCase();
            if(p.includes('home') || p.includes('index')) return '<span class="bg-blue-500/10 text-blue-400 border border-blue-500/20 px-2 py-0.5 rounded text-[9px] font-bold uppercase">Home</span>';
            if(p.includes('resume')) return '<span class="bg-fuchsia-500/10 text-fuchsia-400 border border-fuchsia-500/20 px-2 py-0.5 rounded text-[9px] font-bold uppercase">Resume</span>';
            if(p.includes('contact')) return '<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded text-[9px] font-bold uppercase">Contact</span>';
            return `<span class="bg-slate-500/10 text-slate-400 border border-slate-500/20 px-2 py-0.5 rounded text-[9px] font-bold uppercase">${p}</span>`;
        }

        async function loadStats() {
            const list = document.getElementById('visitor-list');
            try {
                const res = await fetch('/api/get_views', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ password: pass })
                });

                if(!res.ok) throw new Error("Unauthorized");

                const data = await res.json();

                // Update Stats
                document.getElementById('stat-home').innerText = data.stats.home;
                document.getElementById('stat-resume').innerText = data.stats.resume;
                document.getElementById('stat-total').innerText = data.stats.total;

                // Update List
                if(data.visitors && data.visitors.length > 0) {
                    list.innerHTML = data.visitors.map(v => `
                        <div class="flex items-center justify-between border-b border-slate-900 pb-2">
                            <div class="flex items-center gap-3">
                                <span class="mono text-[10px] text-blue-300 w-24 truncate">${v.ip}</span>
                                ${getBadge(v.page)}
                            </div>
                            <span class="mono text-[10px] text-slate-600">${v.time.split(' ')[1]}</span>
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = '<p class="text-center text-slate-700 py-10 mono text-xs">No entries found in log file.</p>';
                }
            } catch(e) {
                list.innerHTML = `<p class="text-center text-red-500 py-10 mono text-xs">Access Denied: ${e.message}</p>`;
            }
        }

        async function clearData() {
            if(!confirm("Clear all logs?")) return;
            await fetch('/api/clear_views', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ password: pass })
            });
            loadStats();
        }

        function logout() {
            sessionStorage.removeItem('admin_session_pass');
            window.location.href = './resume.html';
        }

        window.onload = loadStats;
    </script>
</body>
</html>
