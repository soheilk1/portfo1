<script>
  document.addEventListener("DOMContentLoaded", function () {

      // --- NEW: Identify as the Home Page ---
      setTimeout(() => {
          fetch("/api/track_view", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ page: "home" }) // Telling server this is the Home page!
          })
          .catch(err => {
              // Silently ignoring network errors from local preview environments
          });
      }, 1000);

      // --- Typing Effect Logic ---
      const titles = [
          "Cloud Infrastructure Engineer",
          "DevSecOps Specialist",
          "Python Backend Developer",
          "IT Operations Manager"
      ];

      let titleIndex = 0;
      let charIndex = 0;
      let isDeleting = false;
      const typewriterElement = document.getElementById("custom-typewriter");

      function type() {
          const currentTitle = titles[titleIndex];

          if (isDeleting) {
              typewriterElement.textContent = currentTitle.substring(0, charIndex - 1);
              charIndex--;
          } else {
              typewriterElement.textContent = currentTitle.substring(0, charIndex + 1);
              charIndex++;
          }

          let typingSpeed = isDeleting ? 40 : 80;

          if (!isDeleting && charIndex === currentTitle.length) {
              typingSpeed = 2000;
              isDeleting = true;
          } else if (isDeleting && charIndex === 0) {
              isDeleting = false;
              titleIndex = (titleIndex + 1) % titles.length;
              typingSpeed = 500;
          }
          setTimeout(type, typingSpeed);
      }
      setTimeout(type, 1000);
  });
</script>
